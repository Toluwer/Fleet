name: Build Python Editor Frame v5

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download verified frame source
        uses: actions/download-artifact@v4
        with:
          name: Python-Editor-Frame-v2-Source
          path: .chatgpt-build/source-artifact
          github-token: ${{ github.token }}
          repository: Toluwer/Fleet
          run-id: 30113967176

      - name: Restore source and apply frame fixes
        shell: pwsh
        run: |
          $sourceArchive = '.chatgpt-build/source-artifact/frame-v2-source.tar.gz'
          if (-not (Test-Path $sourceArchive)) { throw 'Verified source archive was not found.' }

          New-Item -ItemType Directory -Force '.chatgpt-build/python-editor' | Out-Null
          tar -xzf $sourceArchive -C '.chatgpt-build/python-editor'
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract verified source.' }

          $v5Base64 = (Get-ChildItem '.chatgpt-build/frame-v5/part-*.txt' |
            Sort-Object Name |
            ForEach-Object { Get-Content -Raw $_.FullName }) -join ''
          $v5Patch = '.chatgpt-build/frame-v4-to-v5.patch'
          [IO.File]::WriteAllBytes($v5Patch, [Convert]::FromBase64String($v5Base64))

          Push-Location '.chatgpt-build/python-editor'
          try {
            git apply --whitespace=nowarn '..\frame-v2-to-v4.patch'
            if ($LASTEXITCODE -ne 0) { throw 'Could not apply frame v4 base changes.' }
            git apply --whitespace=nowarn '..\frame-v4-to-v5.patch'
            if ($LASTEXITCODE -ne 0) { throw 'Could not apply frame v5 corrections.' }
          } finally {
            Pop-Location
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore application icon
        shell: pwsh
        working-directory: .chatgpt-build/python-editor
        run: |
          $bytes = [Convert]::FromBase64String((Get-Content -Raw assets/icon.ico.b64))
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) 'assets/icon.ico'), $bytes)

      - name: Install dependencies
        working-directory: .chatgpt-build/python-editor
        run: npm install --no-audit --no-fund

      - name: Build portable executable
        working-directory: .chatgpt-build/python-editor
        run: npm run dist

      - name: Verify build output
        shell: pwsh
        working-directory: .chatgpt-build/python-editor
        run: |
          if (-not (Test-Path 'build/Release/window_frame.node')) { throw 'Native frame module was not created.' }
          if (-not (Test-Path 'dist/PythonEditorFrameV5.exe')) { throw 'Portable executable was not created.' }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Python-Editor-Frame-v5
          path: .chatgpt-build/python-editor/dist/PythonEditorFrameV5.exe
          if-no-files-found: error
          compression-level: 0
