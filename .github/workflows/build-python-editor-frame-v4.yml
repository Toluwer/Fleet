name: Build Python Editor Frame v6

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download verified frame source
        uses: actions/download-artifact@v4
        with:
          name: Python-Editor-Frame-v2-Source
          path: .chatgpt-build/source-artifact
          github-token: ${{ github.token }}
          repository: Toluwer/Fleet
          run-id: 30113967176

      - name: Restore and patch source
        shell: pwsh
        run: |
          $sourceArchive = '.chatgpt-build/source-artifact/frame-v2-source.tar.gz'
          if (-not (Test-Path $sourceArchive)) { throw 'Verified source archive was not found.' }

          New-Item -ItemType Directory -Force '.chatgpt-build/python-editor' | Out-Null
          tar -xzf $sourceArchive -C '.chatgpt-build/python-editor'
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract verified source.' }

          $v6Compressed = [Convert]::FromBase64String((Get-Content -Raw '.chatgpt-build/frame-v4-to-v6-exact.patch.gz.b64'))
          $inputStream = [IO.MemoryStream]::new($v6Compressed)
          $gzipStream = [IO.Compression.GZipStream]::new($inputStream, [IO.Compression.CompressionMode]::Decompress)
          $v6Patch = '.chatgpt-build/frame-v4-to-v6-exact.patch'
          $outputStream = [IO.File]::Create($v6Patch)
          $gzipStream.CopyTo($outputStream)
          $outputStream.Dispose()
          $gzipStream.Dispose()
          $inputStream.Dispose()

          Push-Location '.chatgpt-build/python-editor'
          try {
            git apply --whitespace=nowarn '..\frame-v2-to-v4.patch'
            if ($LASTEXITCODE -ne 0) { throw 'Could not apply frame v4 base changes.' }
            git apply --whitespace=nowarn '..\frame-v4-to-v6-exact.patch'
            if ($LASTEXITCODE -ne 0) { throw 'Could not apply exact frame v6 changes.' }
          } finally {
            Pop-Location
          }

      - name: Verify corrected source
        shell: pwsh
        working-directory: .chatgpt-build/python-editor
        run: |
          $css = Get-Content -Raw 'src/styles.css'
          $package = Get-Content -Raw 'package.json'
          $native = Get-Content -Raw 'native/window_frame.cc'
          if ($css -notmatch 'grid-template-rows:\s*48px') { throw 'The 48px title bar is missing.' }
          if ($css -notmatch '\.window-button svg[\s\S]*width:\s*20px') { throw 'The 20px caption glyphs are missing.' }
          if ($css -notmatch 'clip-path:\s*inset\(0 round 12px\)') { throw 'The rounded per-pixel clip is missing.' }
          if ($css -notmatch '--bg:\s*#000000') { throw 'The pure-black theme is missing.' }
          if ($package -notmatch 'PythonEditorFrameV6') { throw 'The v6 executable name is missing.' }
          if ($native -match 'kDwmNcRenderingDisabled') { throw 'DWM composition was incorrectly disabled.' }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore application icon
        shell: pwsh
        working-directory: .chatgpt-build/python-editor
        run: |
          $bytes = [Convert]::FromBase64String((Get-Content -Raw assets/icon.ico.b64))
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) 'assets/icon.ico'), $bytes)

      - name: Install dependencies
        working-directory: .chatgpt-build/python-editor
        run: npm install --no-audit --no-fund

      - name: Build portable executable
        working-directory: .chatgpt-build/python-editor
        run: npm run dist

      - name: Verify packaged application
        shell: pwsh
        working-directory: .chatgpt-build/python-editor
        run: |
          if (-not (Test-Path 'build/Release/window_frame.node')) { throw 'Native frame module was not created.' }
          if (-not (Test-Path 'dist/PythonEditorFrameV6.exe')) { throw 'The exact v6 portable executable was not created.' }
          if (-not (Test-Path 'dist/win-unpacked/resources/app.asar')) { throw 'The packaged ASAR was not created.' }
          node 'node_modules/@electron/asar/bin/asar.js' extract 'dist/win-unpacked/resources/app.asar' 'dist/verified-app'
          $packedCss = Get-Content -Raw 'dist/verified-app/src/styles.css'
          $packedPackage = Get-Content -Raw 'dist/verified-app/package.json'
          if ($packedCss -notmatch 'grid-template-rows:\s*48px') { throw 'Packaged app has the wrong title bar.' }
          if ($packedCss -notmatch '\.window-button svg[\s\S]*width:\s*20px') { throw 'Packaged app has the wrong caption glyph size.' }
          if ($packedCss -notmatch 'clip-path:\s*inset\(0 round 12px\)') { throw 'Packaged app is missing rounded clipping.' }
          if ($packedCss -notmatch '--bg:\s*#000000') { throw 'Packaged app is not pure black.' }
          if ($packedPackage -notmatch 'PythonEditorFrameV6') { throw 'Packaged app is not v6.' }
          Get-FileHash 'dist/PythonEditorFrameV6.exe' -Algorithm SHA256 | Format-List

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Python-Editor-Frame-v6-verified
          path: .chatgpt-build/python-editor/dist/PythonEditorFrameV6.exe
          if-no-files-found: error
          compression-level: 0
