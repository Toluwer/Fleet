name: Build Python Editor Frame v7

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download original verified source
        uses: actions/download-artifact@v4
        with:
          name: Python-Editor-Frame-v2-Source
          path: .chatgpt-build/source-artifact
          github-token: ${{ github.token }}
          repository: Toluwer/Fleet
          run-id: 30113967176

      - name: Restore source and apply direct patch
        shell: pwsh
        run: |
          $sourceArchive = '.chatgpt-build/source-artifact/frame-v2-source.tar.gz'
          if (-not (Test-Path $sourceArchive)) { throw 'Verified source archive was not found.' }
          New-Item -ItemType Directory -Force '.chatgpt-build/python-editor' | Out-Null
          tar -xzf $sourceArchive -C '.chatgpt-build/python-editor'
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract verified source.' }

          $compressed = [Convert]::FromBase64String((Get-Content -Raw '.chatgpt-build/frame-v2-to-v7-direct.patch.gz.b64'))
          $inputStream = [IO.MemoryStream]::new($compressed)
          $gzipStream = [IO.Compression.GZipStream]::new($inputStream, [IO.Compression.CompressionMode]::Decompress)
          $patchPath = '.chatgpt-build/frame-v2-to-v7-direct.patch'
          $outputStream = [IO.File]::Create($patchPath)
          $gzipStream.CopyTo($outputStream)
          $outputStream.Dispose()
          $gzipStream.Dispose()
          $inputStream.Dispose()

          Push-Location '.chatgpt-build/python-editor'
          try {
            git apply --whitespace=nowarn '..\frame-v2-to-v7-direct.patch'
            if ($LASTEXITCODE -ne 0) { throw 'Could not apply direct frame v7 patch.' }
          } finally {
            Pop-Location
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore application icon
        shell: pwsh
        working-directory: .chatgpt-build/python-editor
        run: |
          $bytes = [Convert]::FromBase64String((Get-Content -Raw assets/icon.ico.b64))
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) 'assets/icon.ico'), $bytes)

      - name: Install dependencies
        working-directory: .chatgpt-build/python-editor
        run: npm install --no-audit --no-fund

      - name: Build portable executable
        working-directory: .chatgpt-build/python-editor
        run: npm run dist

      - name: Prepare deliverables
        shell: pwsh
        working-directory: .chatgpt-build/python-editor
        run: |
          $exe = Get-ChildItem 'dist/*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'Portable executable was not created.' }
          Copy-Item $exe.FullName 'dist/PythonEditorFrameV7-Direct.exe' -Force
          Copy-Item 'src/index.html' 'dist/verified-index.html' -Force
          Copy-Item 'src/styles.css' 'dist/verified-styles.css' -Force
          Copy-Item 'package.json' 'dist/verified-package.json' -Force
          Get-FileHash 'dist/PythonEditorFrameV7-Direct.exe' -Algorithm SHA256 | Format-List | Out-File 'dist/verification.txt'

      - name: Upload direct build and patched sources
        uses: actions/upload-artifact@v4
        with:
          name: Python-Editor-Frame-v7-direct-inspectable
          path: |
            .chatgpt-build/python-editor/dist/PythonEditorFrameV7-Direct.exe
            .chatgpt-build/python-editor/dist/verified-index.html
            .chatgpt-build/python-editor/dist/verified-styles.css
            .chatgpt-build/python-editor/dist/verified-package.json
            .chatgpt-build/python-editor/dist/verification.txt
          if-no-files-found: error
          compression-level: 0
