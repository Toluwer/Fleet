name: Build Python Editor Frame v7

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download original verified source
        uses: actions/download-artifact@v4
        with:
          name: Python-Editor-Frame-v2-Source
          path: .chatgpt-build/source-artifact
          github-token: ${{ github.token }}
          repository: Toluwer/Fleet
          run-id: 30113967176

      - name: Restore source and apply direct patch
        shell: pwsh
        run: |
          $sourceArchive = '.chatgpt-build/source-artifact/frame-v2-source.tar.gz'
          if (-not (Test-Path $sourceArchive)) { throw 'Verified source archive was not found.' }
          New-Item -ItemType Directory -Force '.chatgpt-build/python-editor' | Out-Null
          tar -xzf $sourceArchive -C '.chatgpt-build/python-editor'
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract verified source.' }

          $compressed = [Convert]::FromBase64String((Get-Content -Raw '.chatgpt-build/frame-v2-to-v7-direct.patch.gz.b64'))
          $inputStream = [IO.MemoryStream]::new($compressed)
          $gzipStream = [IO.Compression.GZipStream]::new($inputStream, [IO.Compression.CompressionMode]::Decompress)
          $patchPath = '.chatgpt-build/frame-v2-to-v7-direct.patch'
          $outputStream = [IO.File]::Create($patchPath)
          $gzipStream.CopyTo($outputStream)
          $outputStream.Dispose()
          $gzipStream.Dispose()
          $inputStream.Dispose()

          Push-Location '.chatgpt-build/python-editor'
          try {
            git apply --whitespace=nowarn '..\frame-v2-to-v7-direct.patch'
            if ($LASTEXITCODE -ne 0) { throw 'Could not apply direct frame v7 patch.' }
          } finally {
            Pop-Location
          }

      - name: Verify corrected source before build
        shell: pwsh
        working-directory: .chatgpt-build/python-editor
        run: |
          $html = Get-Content -Raw 'src/index.html'
          $css = Get-Content -Raw 'src/styles.css'
          $package = Get-Content -Raw 'package.json'
          if ($html.Contains('class="app-logo"')) { throw 'Title-bar logo still exists.' }
          if (-not $html.Contains('data-build="frame-v7"')) { throw 'Frame v7 build marker is missing.' }
          if (-not $css.Contains('grid-template-rows: 48px minmax(0, 1fr);')) { throw '48px title bar is missing.' }
          if (-not $css.Contains('width: 22px;')) { throw '22px caption glyphs are missing.' }
          if (-not $css.Contains('--bg: #000000;')) { throw 'Pure-black theme is missing.' }
          if (-not $css.Contains('clip-path: inset(0 round 12px);')) { throw 'Rounded per-pixel clipping is missing.' }
          if (-not $package.Contains('PythonEditorFrameV7')) { throw 'V7 executable name is missing.' }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore application icon
        shell: pwsh
        working-directory: .chatgpt-build/python-editor
        run: |
          $bytes = [Convert]::FromBase64String((Get-Content -Raw assets/icon.ico.b64))
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) 'assets/icon.ico'), $bytes)

      - name: Install dependencies
        working-directory: .chatgpt-build/python-editor
        run: npm install --no-audit --no-fund

      - name: Build portable executable
        working-directory: .chatgpt-build/python-editor
        run: npm run dist

      - name: Verify packaged application contents
        shell: pwsh
        working-directory: .chatgpt-build/python-editor
        run: |
          if (-not (Test-Path 'build/Release/window_frame.node')) { throw 'Native frame module was not created.' }
          if (-not (Test-Path 'dist/PythonEditorFrameV7.exe')) { throw 'Exact V7 portable executable was not created.' }
          if (-not (Test-Path 'dist/win-unpacked/resources/app.asar')) { throw 'Packaged ASAR was not created.' }
          npx asar extract 'dist/win-unpacked/resources/app.asar' 'dist/verified-app'
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract packaged ASAR.' }
          $packedHtml = Get-Content -Raw 'dist/verified-app/src/index.html'
          $packedCss = Get-Content -Raw 'dist/verified-app/src/styles.css'
          $packedPackage = Get-Content -Raw 'dist/verified-app/package.json'
          if ($packedHtml.Contains('class="app-logo"')) { throw 'Packaged title-bar logo still exists.' }
          if (-not $packedHtml.Contains('data-build="frame-v7"')) { throw 'Packaged V7 marker is missing.' }
          if (-not $packedCss.Contains('grid-template-rows: 48px minmax(0, 1fr);')) { throw 'Packaged title bar is not 48px.' }
          if (-not $packedCss.Contains('width: 22px;')) { throw 'Packaged caption glyphs are not 22px.' }
          if (-not $packedCss.Contains('--bg: #000000;')) { throw 'Packaged theme is not pure black.' }
          if (-not $packedCss.Contains('clip-path: inset(0 round 12px);')) { throw 'Packaged rounded clipping is missing.' }
          if (-not $packedPackage.Contains('PythonEditorFrameV7')) { throw 'Packaged application is not V7.' }
          $hash = (Get-FileHash 'dist/PythonEditorFrameV7.exe' -Algorithm SHA256).Hash
          @(
            'PythonEditorFrameV7.exe',
            "SHA256=$hash",
            'TitleBar=48px',
            'CaptionGlyphs=22px',
            'TitleBarLogo=removed',
            'Theme=pure-black',
            'RoundedClip=12px'
          ) | Set-Content 'dist/verification.txt'

      - name: Upload verified executable
        uses: actions/upload-artifact@v4
        with:
          name: Python-Editor-Frame-v7-direct-verified
          path: |
            .chatgpt-build/python-editor/dist/PythonEditorFrameV7.exe
            .chatgpt-build/python-editor/dist/verification.txt
          if-no-files-found: error
          compression-level: 0
