name: Build Python Editor Frame v7

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download original verified source
        uses: actions/download-artifact@v4
        with:
          name: Python-Editor-Frame-v2-Source
          path: .chatgpt-build/source-artifact
          github-token: ${{ github.token }}
          repository: Toluwer/Fleet
          run-id: 30113967176

      - name: Restore source and exact v7 overlay
        shell: pwsh
        run: |
          $sourceArchive = '.chatgpt-build/source-artifact/frame-v2-source.tar.gz'
          if (-not (Test-Path $sourceArchive)) { throw 'Verified source archive was not found.' }
          New-Item -ItemType Directory -Force '.chatgpt-build/python-editor' | Out-Null
          tar -xzf $sourceArchive -C '.chatgpt-build/python-editor'
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract verified source.' }

          $overlayBytes = [Convert]::FromBase64String((Get-Content -Raw '.chatgpt-build/frame-v7-overlay.tar.gz.b64'))
          $overlayPath = '.chatgpt-build/frame-v7-overlay.tar.gz'
          [IO.File]::WriteAllBytes($overlayPath, $overlayBytes)
          tar -xzf $overlayPath -C '.chatgpt-build/python-editor'
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract exact v7 overlay.' }

      - name: Verify exact v7 source
        shell: pwsh
        working-directory: .chatgpt-build/python-editor
        run: |
          $html = Get-Content -Raw 'src/index.html'
          $css = Get-Content -Raw 'src/styles.css'
          $package = Get-Content -Raw 'package.json'
          if ($html -match 'class="app-logo"') { throw 'Title-bar logo still exists.' }
          if ($html -notmatch 'data-build="frame-v7"') { throw 'Frame v7 marker is missing.' }
          if ($css -notmatch 'grid-template-rows:\s*48px') { throw '48px title bar is missing.' }
          if ($css -notmatch '\.window-button svg[\s\S]*width:\s*22px') { throw '22px caption glyphs are missing.' }
          if ($css -notmatch '--bg:\s*#000000') { throw 'Pure-black theme is missing.' }
          if ($css -notmatch 'clip-path:\s*inset\(0 round 12px\)') { throw 'Rounded clipping is missing.' }
          if ($package -notmatch 'PythonEditorFrameV7') { throw 'V7 executable name is missing.' }
          Write-Host 'Exact v7 source verified.'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore application icon
        shell: pwsh
        working-directory: .chatgpt-build/python-editor
        run: |
          $bytes = [Convert]::FromBase64String((Get-Content -Raw assets/icon.ico.b64))
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) 'assets/icon.ico'), $bytes)

      - name: Install dependencies
        working-directory: .chatgpt-build/python-editor
        run: npm install --no-audit --no-fund

      - name: Build portable executable
        working-directory: .chatgpt-build/python-editor
        run: npm run dist

      - name: Prepare verified deliverables
        shell: pwsh
        working-directory: .chatgpt-build/python-editor
        run: |
          if (-not (Test-Path 'dist/PythonEditorFrameV7.exe')) { throw 'V7 portable executable was not created.' }
          if (-not (Test-Path 'dist/win-unpacked/resources/app.asar')) { throw 'Packaged app.asar was not created.' }
          Copy-Item 'src/index.html' 'dist/verified-index.html' -Force
          Copy-Item 'src/styles.css' 'dist/verified-styles.css' -Force
          Copy-Item 'package.json' 'dist/verified-package.json' -Force
          $hash = (Get-FileHash 'dist/PythonEditorFrameV7.exe' -Algorithm SHA256).Hash
          @(
            'PythonEditorFrameV7.exe',
            "SHA256=$hash",
            'TitleBar=48px',
            'CaptionGlyphs=22px',
            'TitleBarLogo=removed',
            'Theme=pure-black',
            'RoundedClip=12px'
          ) | Set-Content 'dist/verification.txt'

      - name: Upload verified v7 build
        uses: actions/upload-artifact@v4
        with:
          name: Python-Editor-Frame-v7-exact-verified
          path: |
            .chatgpt-build/python-editor/dist/PythonEditorFrameV7.exe
            .chatgpt-build/python-editor/dist/win-unpacked/resources/app.asar
            .chatgpt-build/python-editor/dist/verified-index.html
            .chatgpt-build/python-editor/dist/verified-styles.css
            .chatgpt-build/python-editor/dist/verified-package.json
            .chatgpt-build/python-editor/dist/verification.txt
          if-no-files-found: error
          compression-level: 0
