name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Set CODESIGNING_PFX (base64 of a .pfx) + CODESIGNING_PFX_PASSWORD as
      # repo secrets to have the installer signed automatically.
      HAS_PFX: ${{ secrets.CODESIGNING_PFX != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      - name: Run selftest
        run: npm run selftest

      # Builds the custom installer app + packs the portable distribution
      # into it: dist/FleetInstaller.exe (self-extracting Win32 app).
      - name: Build installer (portable dist + custom Win32 installer)
        run: npm run dist

      # build.rs silently falls back to "no embedded resources" when no rc.exe
      # is found - fail loudly if icon/manifest/VERSIONINFO did not make it in.
      - name: Verify installer PE metadata
        shell: pwsh
        run: |
          $vi = (Get-Item dist/FleetInstaller.exe).VersionInfo
          if ([string]::IsNullOrWhiteSpace($vi.FileVersion)) { throw 'FleetInstaller.exe has no VERSIONINFO resource.' }
          if ($vi.ProductName -ne 'Fleet') { throw "ProductName wrong: '$($vi.ProductName)'" }
          if ([string]::IsNullOrWhiteSpace($vi.CompanyName)) { throw 'CompanyName missing.' }
          Write-Host "PE metadata OK: FileVersion=$($vi.FileVersion) ProductName=$($vi.ProductName) Company=$($vi.CompanyName)"

      # Signs before latest.yml/checksums are generated so every published
      # digest matches the signed exe. Skipped entirely without the secrets.
      - name: Sign installer (optional, when cert secrets exist)
        if: env.HAS_PFX == 'true'
        env:
          PFX: ${{ secrets.CODESIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.CODESIGNING_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe `
            | Where-Object { $_.FullName -match '\\x64\\' } `
            | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in Windows Kits.' }
          $pfxPath = Join-Path $env:TEMP 'fleet-codesign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX))
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f $pfxPath /p $env:PFX_PASSWORD dist/FleetInstaller.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed ($LASTEXITCODE)." }
          Remove-Item $pfxPath -Force

      - name: Generate update feed (latest.yml with sha512)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/make-release.ps1

      - name: Collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'release-assets'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item dist/FleetInstaller.exe $out -Force
          Copy-Item dist/latest.yml $out -Force
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path dist/Fleet -DestinationPath "release-assets/FleetPortable_${version}_x64.zip" -Force
          # SHA-256 manifest so users (and antivirus false-positive reports)
          # can verify exactly what CI built.
          Get-ChildItem $out -File | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            '{0}  {1}' -f $h.Hash.ToLower(), $_.Name
          } | Set-Content (Join-Path $out 'checksums.txt') -Encoding ascii
          Get-ChildItem $out | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fleet-windows-assets
          path: release-assets/*
          if-no-files-found: error

  audit:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built installer
        uses: actions/download-artifact@v4
        with:
          name: fleet-windows-assets
          path: release-assets

      - name: Run installer UI audit (real install + uninstall + screenshots)
        shell: powershell
        run: |
          ./scripts/audit-installer-ui.ps1 -InstallerPath "release-assets/FleetInstaller.exe"

      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-ui-audit
          path: audit-output/
          if-no-files-found: warn
