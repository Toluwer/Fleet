name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      - name: Run selftest
        run: npm run selftest

      - name: Build installer (tauri build + NSIS)
        run: npm run dist

      - name: Generate update feed (latest.yml with sha512)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/make-release.ps1

      - name: Build portable zip
        run: npm run build

      - name: Collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'release-assets'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item dist/FleetInstaller.exe $out -Force
          Copy-Item dist/latest.yml $out -Force
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path dist/Fleet -DestinationPath "release-assets/FleetPortable_${version}_x64.zip" -Force
          Get-ChildItem $out | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fleet-windows-assets
          path: release-assets/*
          if-no-files-found: error
