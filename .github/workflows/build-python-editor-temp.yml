name: Build Python Editor Dark Frame

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture verified frame source
        shell: pwsh
        run: |
          $restoreLog = Join-Path (Get-Location) '.chatgpt-build/restore.log'
          try {
            $archive = Join-Path $env:RUNNER_TEMP 'python-editor-source.tar.gz'
            $base64 = (Get-ChildItem '.chatgpt-build/chunks/part-*.txt' |
              Sort-Object Name |
              ForEach-Object { Get-Content -Raw $_.FullName }) -join ''
            [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($base64))
            New-Item -ItemType Directory -Force '.chatgpt-build/python-editor' | Out-Null
            tar -xzf $archive -C '.chatgpt-build/python-editor'
            if ($LASTEXITCODE -ne 0) { throw 'Could not extract the application source.' }

            $patchArchive = Join-Path $env:RUNNER_TEMP 'python-editor-frame-v2-patch.tar.gz'
            $patchBase64 = (git show '0e5121da83ef816509400664214613980e238b68:.chatgpt-build/python-editor-frame-patch.tar.gz.b64' 2>> $restoreLog) -join ''
            if ($LASTEXITCODE -ne 0) { throw 'Could not restore the verified frame v2 patch.' }
            [IO.File]::WriteAllBytes($patchArchive, [Convert]::FromBase64String($patchBase64))
            tar -xzf $patchArchive -C '.chatgpt-build/python-editor'
            if ($LASTEXITCODE -ne 0) { throw 'Could not extract the verified frame v2 patch.' }

            tar -czf '.chatgpt-build/frame-v2-source.tar.gz' -C '.chatgpt-build/python-editor' .
            if ($LASTEXITCODE -ne 0) { throw 'Could not archive the verified frame source.' }
            'Verified frame source captured.' | Set-Content $restoreLog
            throw 'Intentional stop after source capture.'
          } catch {
            $_ | Out-String | Add-Content $restoreLog
            throw
          }

      - name: Upload captured source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Python-Editor-Frame-v2-Source
          path: |
            .chatgpt-build/frame-v2-source.tar.gz
            .chatgpt-build/restore.log
          if-no-files-found: error
