name: Build Python Editor Dark Frame

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and update application source
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'python-editor-source.tar.gz'
          $base64 = (Get-ChildItem '.chatgpt-build/chunks/part-*.txt' |
            Sort-Object Name |
            ForEach-Object { Get-Content -Raw $_.FullName }) -join ''
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($base64))
          New-Item -ItemType Directory -Force '.chatgpt-build/python-editor' | Out-Null
          tar -xzf $archive -C '.chatgpt-build/python-editor'
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the application source.' }

          $frameArchive = Join-Path $env:RUNNER_TEMP 'python-editor-frame-v2-patch.tar.gz'
          $frameBase64 = (git show '0e5121da83ef816509400664214613980e238b68:.chatgpt-build/python-editor-frame-patch.tar.gz.b64') -join ''
          if ($LASTEXITCODE -ne 0) { throw 'Could not restore the verified frame source.' }
          [IO.File]::WriteAllBytes($frameArchive, [Convert]::FromBase64String($frameBase64))
          tar -xzf $frameArchive -C '.chatgpt-build/python-editor'
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the verified frame source.' }

          $normalizedPatch = Join-Path $env:RUNNER_TEMP 'frame-v3.patch'
          $patchText = (Get-Content -Raw '.chatgpt-build/frame-v3.patch').Replace("`r`n", "`n")
          [IO.File]::WriteAllText($normalizedPatch, $patchText, [Text.UTF8Encoding]::new($false))
          git -c core.autocrlf=false apply --directory='.chatgpt-build/python-editor' -p1 --whitespace=nowarn $normalizedPatch
          if ($LASTEXITCODE -ne 0) { throw 'Could not apply the dark frame v3 changes.' }

          $packagePath = '.chatgpt-build/python-editor/package.json'
          $packageText = Get-Content -Raw $packagePath
          $packageText = $packageText.Replace('"node-gyp": "11.5.0"', '"node-gyp": "11.4.2"')
          [IO.File]::WriteAllText($packagePath, $packageText, [Text.UTF8Encoding]::new($false))

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore application icon
        shell: pwsh
        working-directory: .chatgpt-build/python-editor
        run: |
          $bytes = [Convert]::FromBase64String((Get-Content -Raw assets/icon.ico.b64))
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) 'assets/icon.ico'), $bytes)

      - name: Install dependencies
        working-directory: .chatgpt-build/python-editor
        run: npm install --no-audit --no-fund

      - name: Build portable executable
        id: build
        shell: pwsh
        continue-on-error: true
        working-directory: .chatgpt-build/python-editor
        run: |
          npm run dist *>&1 | Tee-Object -FilePath build.log
          $exitCode = $LASTEXITCODE
          Set-Content -Path build-exit-code.txt -Value $exitCode
          exit $exitCode

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Python-Editor-Dark-Frame-Build-Log
          path: |
            .chatgpt-build/python-editor/build.log
            .chatgpt-build/python-editor/build-exit-code.txt
          if-no-files-found: warn

      - name: Verify build result
        shell: pwsh
        working-directory: .chatgpt-build/python-editor
        run: |
          $exitCode = [int](Get-Content -Raw build-exit-code.txt)
          if ($exitCode -ne 0) {
            Write-Error "Electron build failed with exit code $exitCode."
            exit $exitCode
          }
          if (-not (Test-Path 'build/Release/window_frame.node')) {
            Write-Error 'Native window frame module was not created.'
            exit 1
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Python-Editor-Dark-Frame-v3
          path: .chatgpt-build/python-editor/dist/PythonEditorDarkFrameV3.exe
          if-no-files-found: error
          compression-level: 0
