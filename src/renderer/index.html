  <div class="window-shell">
  <header class="titlebar" id="titlebar">
    <div class="titlebar-drag" id="titlebar-drag" aria-label="Drag window"></div>
    <div class="window-controls" aria-label="Window controls">
      <button type="button" data-window-action="minimize" aria-label="Minimize" title="Minimize">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M.5 5.5h9"/></svg>
      </button>
      <button type="button" class="window-maximize" data-window-action="maximize" aria-label="Maximize" title="Maximize">
        <svg class="maximize-glyph" viewBox="0 0 10 10" aria-hidden="true"><rect x=".5" y=".5" width="9" height="9"/></svg>
        <svg class="restore-glyph" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 3.5V1.5h5v5h-2"/><rect x="1.5" y="3.5" width="5" height="5"/></svg>
      </button>
      <button type="button" class="window-close" data-window-action="close" aria-label="Close" title="Close">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="m.5.5 9 9M9.5.5l-9 9"/></svg>
      </button>
    </div>
  </header>

  <div class="app">
    <!-- Navigation rail -->
    <aside class="rail">
      <nav class="nav" id="nav">
        <button data-view="instances" class="active"><svg class="ico"><use href="#i-layers"/></svg><span class="label">Instances</span><span class="count" id="nav-count">0</span></button>
        <button data-view="games"><svg class="ico"><use href="#i-compass"/></svg><span class="label">Games</span></button>
        <button data-view="accounts"><svg class="ico"><use href="#i-users"/></svg><span class="label">Accounts</span><span class="count" id="nav-accounts">0</span></button>
        <button data-view="people"><svg class="ico"><use href="#i-users-group"/></svg><span class="label">People</span></button>
        <button data-view="stats"><svg class="ico"><use href="#i-activity"/></svg><span class="label">Stats</span></button>
        <button data-view="history"><svg class="ico"><use href="#i-clock"/></svg><span class="label">History</span></button>
        <button data-view="diagnostics"><svg class="ico"><use href="#i-activity"/></svg><span class="label">Diagnostics</span></button>
        <button data-view="settings"><svg class="ico"><use href="#i-settings"/></svg><span class="label">Settings</span></button>
        <button data-view="help"><svg class="ico"><use href="#i-help"/></svg><span class="label">Help</span></button>
      </nav>

      <div class="spacer"></div>
      <button class="rail-bell" id="rail-bell" type="button" aria-label="Notifications" data-tip="Notifications" aria-expanded="false">
        <svg class="ico"><use href="#i-bell"/></svg>
        <span class="bell-badge" id="bell-badge" hidden></span>
      </button>
      <div class="rail-foot" id="rail-foot" title="Fleet"></div>
    </aside>

    <!-- Content -->
    <main class="content"><div id="content"></div></main>
  </div>

  <!-- Context menu -->
  <div class="ctxmenu" id="ctxmenu"></div>

  <!-- Modal -->
  <div class="modal-back" id="modal-back"><div class="modal" id="modal"></div></div>

  <!-- Command palette (Ctrl+K) -->
  <div class="palette-back" id="palette-back" hidden>
    <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="p-input-row">
        <svg class="ico"><use href="#i-search"/></svg>
        <input id="palette-input" type="text" placeholder="Search commands, accounts, games…" autocomplete="off" spellcheck="false" aria-label="Search commands">
      </div>
      <div class="p-list" id="palette-list" role="listbox"></div>
      <div class="p-foot"><span><b>Ctrl+K</b> toggle</span><span>↑↓ select</span><span><b>1-9</b> run</span><span><b>Enter</b> run</span><span><b>Esc</b> close</span></div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toasts" id="toasts" aria-live="polite" aria-label="Notifications"></div>

  <!-- Notification center -->
  <div class="notif-panel" id="notif-panel" hidden aria-label="Notification history"></div>
  </div>

  <script src="model.js"></script>
  <script src="tauri-bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
