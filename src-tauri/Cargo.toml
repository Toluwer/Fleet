[package]
name = "fleet"
version = "1.5.2"
description = "Fleet - a clean, minimalist multi-instance launcher for Roblox"
authors = ["Toluwa"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fleet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["time"] }
