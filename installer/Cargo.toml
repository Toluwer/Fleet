[package]
name = "fleet-setup"
version = "1.8.8"
edition = "2021"
description = "Fleet installer - a custom single-page Win32 application."
license = "MIT"

[[bin]]
name = "fleet-setup"
path = "src/main.rs"

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Networking_WinHttp",
] }
miniz_oxide = "0.8"
sha2 = "0.10"

[features]
console = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
